# Config file specifically for local development and testing. It is not intended for production use, as it uses self-signed certificates and may not be optimized for performance or security in a production environment.

# List of things missing for production:
# - Proper SSL certificates from a trusted Certificate Authority (CA) instead of self-signed certificates.
# - GZIP compression to reduce the size of responses and improve load times.
# - Logging and monitoring configurations to track access and errors.
# - Security hardening measures, such as rate limiting, IP whitelisting, and protection against common web vulnerabilities (e.g., XSS, CSRF).

# Manages how nginx handles connections and requests.
events {
    # The maximum number of simultaneous connections that can be opened by a worker process.
    worker_connections 1024;
}

# Manages the configuration of the HTTP server, including how requests are processed and routed.
http {
    # Upstream block defines a group of servers that nginx can proxy requests to.
    # Acts as an "Address Book"

    # This defines the frontend_gateway server that points to "frontend:3000", allowing nginx to forward incoming requests to the specified frontend server for processing.
    # "frontend" from "frontend:3000" refers to the hostname of the frontend service defined in the Docker Compose file, and "3000" is the port on which the frontend service is running.
    upstream frontend_gateway {
        server frontend:3000;
    }

    # This defines the backend_gateway server that points to "api-gateway:4000", allowing nginx to forward incoming requests to the specified backend server for processing.
    # "api-gateway" from "api-gateway:4000" refers to the hostname of the backend service defined in the Docker Compose file, and "4000" is the port on which the backend service is running.
    upstream backend_gateway {
        server api-gateway:4000;
    }

    # The server block defines how nginx should handle incoming requests to the server. 
    # It specifies the listening ports, server name, SSL configuration, and how to route requests to the appropriate upstream servers based on the request URI.

    # This server block listens on port 80 for incoming HTTP requests. 
    # It redirects all HTTP traffic to HTTPS by returning a 301 status code and constructing the new URL using the host and request URI.
    # Acts as a "Bouncer" that redirects all HTTP traffic to HTTPS.
    server {
        listen 80;
        server_name localhost;
        return 301 https://$host$request_uri;
    }

    # This server block listens on port 443 for incoming HTTPS requests.
    # It handles SSL termination and routes requests to the appropriate upstream servers.
    # Acts as a "Secure Lobby" that handles secure HTTPS traffic and routes it to the appropriate backend services.
    server {
        listen 443 ssl;
        server_name localhost;

        # The ssl_certificate and ssl_certificate_key directives specify the paths to the SSL certificate and private key files that nginx will use to establish secure connections with clients.
        ssl_certificate /etc/nginx/certs/localhost.pem;
        ssl_certificate_key /etc/nginx/certs/localhost-key.pem;

        # Route A: Standard web traffic (e.g., HTML, CSS, JavaScript) is proxied to the frontend_gateway.
        location / {
            proxy_pass http://frontend_gateway;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Route B: API requests (e.g., RESTful endpoints) that start with "/api/" are proxied to the backend_gateway.
        location /api/ {
            proxy_pass http://backend_gateway;

            # The Host header is set to the value of the $host variable, which represents the original host requested by the client. 
            # This ensures that the backend server receives the correct host information.
            proxy_set_header Host $host; 

            # The X-Real-IP header is set to the value of the $remote_addr variable, which contains the IP address of the client making the request.
            # Most backend applications use this header to determine the actual IP address of the client for logging or security purposes.
            proxy_set_header X-Real-IP $remote_addr;

            # the X-Forwarded-For header is set to the value of the $proxy_add_x_forwarded_for variable, which appends the client's IP address to the existing X-Forwarded-For header.
            # This allows the backend server to identify the original client IP address even when requests are forwarded through multiple proxies (such as Load Balancers, Firewalls, Nginx, etc.).
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # The X-Forwarded-Proto header is set to the value of the $scheme variable, which indicates the protocol (HTTP or HTTPS) used by the client to connect to nginx.
            # This tells the backend server what protocol the client used (HTTP or HTTPS) when making the request, which can be important for generating correct URLs, handling redirects, or applying security policies based on the protocol.
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

